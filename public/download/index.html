<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软件下载 - 大象网络</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen">
  <header class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5">
    <a href="/" class="flex items-center gap-3">
      <img src="/landing/assets/elephant-route-logo.jpg" alt="大象网络" class="h-10 w-10 rounded-full">
      <span class="text-xl font-semibold">大象网络</span>
    </a>
    <a href="/" class="text-sm text-slate-500 hover:text-slate-900">返回首页</a>
  </header>

  <main class="mx-auto max-w-7xl px-5 pb-20 pt-8">
    <section class="mb-10">
      <h1 class="text-4xl font-semibold tracking-tight md:text-5xl">软件下载</h1>
      <p class="mt-4 max-w-2xl text-base leading-7 text-slate-600">
        点击下载按钮将在新标签页打开后台配置的安装包链接。
      </p>
    </section>

    <div id="download-status" class="rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-500">正在加载安装包...</div>
    <div id="download-grid" class="hidden space-y-10"></div>
  </main>

  <script>
    (function () {
      var platforms = [];

      var gridEl = document.getElementById("download-grid");
      var statusEl = document.getElementById("download-status");

      var platformLabels = {
        android: "Android",
        windows: "Windows",
        macos: "macOS",
        ios: "iOS",
        linux: "Linux"
      };

      function setStatus(message, tone) {
        statusEl.textContent = message;
        statusEl.className = "rounded-lg border p-5 text-sm " + (
          tone === "error"
            ? "border-rose-200 bg-rose-50 text-rose-600"
            : "border-slate-200 bg-white text-slate-500"
        );
        statusEl.classList.remove("hidden");
        gridEl.classList.add("hidden");
      }

      function formatBytes(bytes) {
        if (!bytes) {
          return "未知大小";
        }
        var units = ["B", "KB", "MB", "GB"];
        var value = Number(bytes);
        var index = 0;
        while (value >= 1024 && index < units.length - 1) {
          value = value / 1024;
          index += 1;
        }
        return value.toFixed(index === 0 ? 0 : 1) + " " + units[index];
      }

      function renderPackages() {
        gridEl.innerHTML = "";
        var renderedCount = 0;

        platforms.forEach(function (platform) {
          var packagesCount = platform.apps.reduce(function (count, app) {
            return count + app.packages.length;
          }, 0);
          if (!packagesCount) {
            return;
          }

          var section = document.createElement("section");
          section.className = "space-y-4";
          section.innerHTML = [
            '<div class="flex items-center gap-3">',
            '  <h2 class="text-2xl font-semibold tracking-tight text-slate-900"></h2>',
            '  <span class="rounded-full bg-slate-100 px-3 py-1 text-sm font-medium text-slate-500"></span>',
            '</div>',
            '<div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3"></div>'
          ].join("");
          section.querySelector("h2").textContent = platformLabels[platform.platform] || platform.platform;
          section.querySelector("span").textContent = packagesCount + " 个安装包";
          var cards = section.querySelector(".grid");

          platform.apps.forEach(function (app) {
            app.packages.forEach(function (pkg) {
              var card = document.createElement("article");
              card.className = "flex min-h-[240px] flex-col rounded-lg border border-slate-200 bg-white p-5 shadow-sm";
              card.innerHTML = [
                '<div class="mb-4">',
                '  <div>',
                '    <h3 class="text-lg font-semibold text-slate-900"></h3>',
                '    <p class="mt-1 text-sm text-slate-500"></p>',
                '  </div>',
                '</div>',
                '<p class="line-clamp-3 min-h-[60px] text-sm leading-6 text-slate-600"></p>',
                '<div class="mt-auto space-y-3 pt-5">',
                '  <div class="text-xs text-slate-500">',
                '    <span class="rounded-md bg-slate-50 px-3 py-2"></span>',
                '  </div>',
                '  <button type="button" class="download-button w-full rounded-md bg-slate-900 px-4 py-3 text-sm font-medium text-white transition hover:bg-emerald-600">立即下载</button>',
                '</div>'
              ].join("");

              card.querySelector("h3").textContent = app.name;
              card.querySelector("h3 + p").textContent = "v" + pkg.version + " build " + pkg.build_number;
              card.querySelector("p.line-clamp-3").textContent = pkg.release_notes || app.description || "适用于 " + (platformLabels[pkg.platform] || pkg.platform) + " 的安装包。";
              card.querySelector(".text-xs span").textContent = formatBytes(pkg.file_size);
              card.querySelector(".download-button").addEventListener("click", function () {
                window.open(pkg.download_url, "_blank", "noopener,noreferrer");
              });
              cards.appendChild(card);
              renderedCount += 1;
            });
          });

          gridEl.appendChild(section);
        });

        if (!renderedCount) {
          setStatus("暂无可下载安装包。");
          return;
        }

        statusEl.classList.add("hidden");
        gridEl.classList.remove("hidden");
      }

      async function loadPackages() {
        try {
          var response = await fetch("/api/v1/app-downloads", { headers: { Accept: "application/json" } });
          var payload = await response.json();
          var data = payload && payload.data ? payload.data : {};
          platforms = data.platforms || [];
          if (!platforms.length) {
            setStatus("暂无可下载安装包。");
            return;
          }
          renderPackages();
        } catch (e) {
          setStatus("安装包加载失败，请稍后重试。", "error");
        }
      }

      loadPackages();
    })();
  </script>
</body>
</html>
