<text x="620" y="508" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">有入群资格？</text>
<text x="620" y="533" font-size="15" text-anchor="middle" font-weight="400" style="fill:#6b7280">查询长期资格记录</text>
<path d="M 620 637 L 780 695 L 620 753 L 460 695 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="620" y="702" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">已绑定 Telegram？</text>
<rect x="460" y="840" width="320" height="80" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="620.0" y="877.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">签发入群申请链接</text>
<text x="620.0" y="905.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">绑定本人 · 建议 10 分钟有效</text>
