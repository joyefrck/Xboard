<text x="620" y="323" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">账号正常？</text>
<text x="620" y="348" font-size="15" text-anchor="middle" font-weight="400" style="fill:#6b7280">未封禁</text>
