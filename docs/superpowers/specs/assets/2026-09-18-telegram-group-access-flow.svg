<text x="620.0" y="1012.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">前往 Telegram 申请</text>
<text x="620.0" y="1040.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">使用绑定的 Telegram 账号</text>
