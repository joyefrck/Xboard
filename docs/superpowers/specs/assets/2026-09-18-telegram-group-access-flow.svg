<text x="620.0" y="1337.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">批准加入官方群</text>
<text x="620.0" y="1365.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">套餐以后到期仍保留资格</text>
<rect x="880" y="288" width="280" height="74" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1020.0" y="322.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">暂停入群</text>
<text x="1020.0" y="350.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">联系支持处理账号状态</text>
<rect x="880" y="467" width="280" height="86" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1020.0" y="507.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">提示未获得资格</text>
<text x="1020.0" y="535.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">购买套餐或由管理员发放</text>
<rect x="880" y="647" width="280" height="96" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1020.0" y="692.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">先绑定 Bot</text>
<text x="1020.0" y="720.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">绑定成功后重新点击加入群组</text>
<rect x="880" y="1117" width="280" height="96" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1020.0" y="1162.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">不批准本次申请</text>
<text x="1020.0" y="1190.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">身份不符、无资格或链接失效</text>
