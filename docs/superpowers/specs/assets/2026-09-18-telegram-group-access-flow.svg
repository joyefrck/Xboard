<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc">
<title id="title">大象网络 Telegram 入群流程 · 评审稿</title>
<desc id="desc">历史付费、管理员赠送或手动添加套餐可获得长期入群资格。登录且账号正常后，依次校验资格、绑定 Telegram、签发短期申请链接，由 Bot 校验实际申请人后批准入群。过期和流量耗尽不影响资格。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827} .sub{fill:#6b7280;font-size:16px} .label{font-size:17px;font-weight:500}</style>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#2563eb"/></marker>
<marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#ea580c"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#059669"/></marker>
</defs><rect width="1200" height="1430" fill="#ffffff"/>
<text x="40" y="51" font-size="30" text-anchor="start" font-weight="600" style="fill:#111827">大象网络 · Telegram 入群流程</text>
<text x="40" y="83" font-size="16" text-anchor="start" font-weight="400" style="fill:#6b7280">评审稿  v1.0  /  2026-09-18  /  尚未实施</text>
<rect x="40" y="106" width="1120" height="48" rx="10" fill="#f0fdf4"/>
<text x="600" y="137" font-size="19" text-anchor="middle" font-weight="500" style="fill:#166534">付费购买、后台赠送、管理员添加 → 长期保留资格；套餐过期、流量耗尽不影响</text>
<rect x="460" y="180" width="320" height="70" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="620.0" y="212.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">点击「加入群组」</text>
<text x="620.0" y="240.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">已登录网站账号</text>
