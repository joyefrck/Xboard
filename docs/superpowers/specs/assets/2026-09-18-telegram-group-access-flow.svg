<text x="273" y="1416" font-size="14" text-anchor="start" font-weight="400" style="fill:#6b7280">拦截 / 补充操作</text>
<path d="M480 1410 H508" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="520" y="1416" font-size="14" text-anchor="start" font-weight="400" style="fill:#6b7280">资格写入 / 读取</text>
<text x="1158" y="1416" font-size="13" text-anchor="end" font-weight="400" style="fill:#6b7280">完整口径、历史补录与验收场景见配套说明书</text>
