<text x="642" y="1267" font-size="17" text-anchor="middle" font-weight="400" style="fill:#2563eb">是</text>
<path d="M780 325 H880" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
