<text x="829" y="1167" font-size="17" text-anchor="middle" font-weight="400" style="fill:#ea580c">否</text>
<rect x="40" y="215" width="320" height="232" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="62" y="249" font-size="20" text-anchor="start" font-weight="600" style="fill:#111827">资格来源 · 任意满足一项</text>
<text x="62" y="292" font-size="19" text-anchor="start" font-weight="500" style="fill:#111827">① 成功付费购买</text>
<text x="62" y="315" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">套餐 / 流量包 / 余额消费</text>
<text x="62" y="352" font-size="19" text-anchor="start" font-weight="500" style="fill:#111827">② 后台直接赠送套餐</text>
<text x="62" y="375" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">管理员发放成功</text>
<text x="62" y="412" font-size="19" text-anchor="start" font-weight="500" style="fill:#111827">③ 管理员手动添加套餐</text>
<text x="62" y="435" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">含创建账号时分配套餐</text>
<rect x="40" y="490" width="320" height="86" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="200.0" y="530.0" font-size="21" text-anchor="middle" font-weight="600" style="fill:#111827">保存长期资格</text>
<text x="200.0" y="558.0" font-size="16" text-anchor="middle" font-weight="400" style="fill:#6b7280">记录来源、时间和操作人</text>
<path d="M200 447 V490" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M360 533 H410 V510 H460" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="40" y="614" font-size="19" text-anchor="start" font-weight="600" style="fill:#111827">资格归属：网站账号</text>
<text x="40" y="646" font-size="18" text-anchor="start" font-weight="400" style="fill:#111827">到期 / 流量耗尽：保留</text>
<text x="40" y="676" font-size="18" text-anchor="start" font-weight="400" style="fill:#111827">封禁期间：暂停入群</text>
<text x="40" y="706" font-size="18" text-anchor="start" font-weight="400" style="fill:#111827">自动试用：不自动授予</text>
<text x="40" y="736" font-size="18" text-anchor="start" font-weight="400" style="fill:#111827">历史来源不明：人工核对补录</text>
<rect x="40" y="845" width="320" height="376" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="62" y="882" font-size="21" text-anchor="start" font-weight="600" style="fill:#111827">异常与恢复</text>
<text x="62" y="925" font-size="17" text-anchor="start" font-weight="500" style="fill:#111827">链接过期</text>
<text x="62" y="949" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">返回网站重新获取</text>
<text x="62" y="986" font-size="17" text-anchor="start" font-weight="500" style="fill:#111827">尚未绑定 / Telegram 号不符</text>
<text x="62" y="1010" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">完成绑定或切换至正确账号</text>
<text x="62" y="1047" font-size="17" text-anchor="start" font-weight="500" style="fill:#111827">Bot / 网络异常</text>
<text x="62" y="1071" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">保留申请，等待重试；不自动放行</text>
<text x="62" y="1108" font-size="17" text-anchor="start" font-weight="500" style="fill:#111827">群组已加入</text>
<text x="62" y="1132" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">无需再次申请</text>
<text x="62" y="1169" font-size="17" text-anchor="start" font-weight="500" style="fill:#111827">已有成员</text>
<text x="62" y="1193" font-size="15" text-anchor="start" font-weight="400" style="fill:#6b7280">本次不批量清理，不因过期踢人</text>
<rect x="880" y="836" width="280" height="190" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="900" y="872" font-size="20" text-anchor="start" font-weight="600" style="fill:#111827">群侧启用条件</text>
<text x="900" y="908" font-size="16" text-anchor="start" font-weight="400" style="fill:#111827">私有群 + 入群申请审批</text>
<text x="900" y="942" font-size="16" text-anchor="start" font-weight="400" style="fill:#111827">Bot 拥有邀请 / 审批权限</text>
<text x="900" y="976" font-size="16" text-anchor="start" font-weight="400" style="fill:#111827">撤销旧免审链接，限制直接拉人</text>
