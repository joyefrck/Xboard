name: Isolated security and VLESS checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-password
          MARIADB_DATABASE: security_p0
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SECURITY_P0_DB_USER: root
      SECURITY_P0_DB_PASSWORD: fixture-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use the production PHP series
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, pcntl, sodium, mbstring, bcmath, zip, redis, curl
          coverage: none
      - name: Verify test runtime
        run: |
          php -r 'foreach (["pdo_mysql", "pdo_sqlite", "pcntl", "sodium", "mbstring"] as $extension) { if (!extension_loaded($extension)) { throw new RuntimeException("Missing " . $extension); } }'
          composer --version
          node --version
      - name: Install isolated dependencies without booting the application
        run: |
          test -f composer.lock
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Install frontend test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run every JavaScript test
        env:
          SECURITY_P0_DB_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports['3306'] }};dbname=security_p0
        run: |
          node tests/prepare-theme-assets.cjs
          node --test tests/*.test.js
          php scripts/version-admin-assets.php --check
      - name: Run every isolated PHP and Python test
        env:
          NODE_AUTOMATION_TEST_BINARY: ${{ runner.temp }}/sing-box
        run: |
          sh scripts/install-node-automation-probe.sh "$RUNNER_TEMP/sing-box"
          sh scripts/run-php-tests.sh
          python3 tests/test_subscription_behavior_monitor.py
      - name: Verify refund concurrency with database row locks
        env:
          ORDER_REFUND_DB_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports['3306'] }};dbname=order_refund_test
          ORDER_REFUND_DB_USER: root
          ORDER_REFUND_DB_PASSWORD: fixture-password
        run: |
          php -r '$db = new PDO(preg_replace("/;dbname=.*$/", "", getenv("ORDER_REFUND_DB_DSN")), getenv("ORDER_REFUND_DB_USER"), getenv("ORDER_REFUND_DB_PASSWORD")); $db->exec("CREATE DATABASE order_refund_test");'
          php tests/refund-receipt-notification.php
      - name: Verify account sessions and security challenges
        env:
          ACCOUNT_SECURITY_TEST_PORT: ${{ job.services.database.ports['3306'] }}
          ACCOUNT_SECURITY_TEST_PASSWORD: fixture-password
        run: |
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=" . getenv("ACCOUNT_SECURITY_TEST_PORT"), "root", getenv("ACCOUNT_SECURITY_TEST_PASSWORD")); $db->exec("CREATE DATABASE account_security");'
          php tests/account-session-security.php
          php tests/account-session-security-concurrency.php
          php tests/account-deletion.php
      - name: Verify online status and statistics concurrency
        env:
          ONLINE_STATUS_TEST_PORT: ${{ job.services.database.ports['3306'] }}
          ONLINE_STATUS_TEST_PASSWORD: fixture-password
        run: |
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=" . getenv("ONLINE_STATUS_TEST_PORT"), "root", getenv("ONLINE_STATUS_TEST_PASSWORD")); $db->exec("CREATE DATABASE online_status_test");'
          env -u ONLINE_STATUS_TEST_PORT php tests/online-status-locking.php
          php tests/online-status-locking.php
          php tests/online-status-locking-concurrency.php
      - name: Verify real modern REALITY probes with fixed release binaries
        env:
          V2BX_TEST_LOG: debug
          REALITY_FIXTURE_DEBUG: '1'
        run: |
          sh scripts/install-node-automation-mihomo.sh "$RUNNER_TEMP/reality-mihomo"
          curl -fLsS --connect-timeout 10 --max-time 180 --retry 2 https://github.com/joyefrck/v2bx_Outbound/releases/download/core-v1.1.0/V2bX-linux-amd64.zip -o "$RUNNER_TEMP/reality-server.zip"
          printf '87ec070fed7d9bd9ff056f7f189766e1274d9095380bf4d03a31c45eb59be2c9  %s\n' "$RUNNER_TEMP/reality-server.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/reality-server.zip" V2bX > "$RUNNER_TEMP/reality-server"
          chmod 755 "$RUNNER_TEMP/reality-server"
          python3 tests/node-automation-reality-runtime.py "$RUNNER_TEMP/reality-server" "$RUNNER_TEMP/reality-mihomo"
          python3 tests/node-automation-reality-runtime.py "$RUNNER_TEMP/reality-server" "$RUNNER_TEMP/reality-mihomo" --subscription-baseline
      - name: Verify third-party Mihomo baseline with modern REALITY
        run: |
          curl -fLsS --connect-timeout 10 --max-time 180 --retry 2 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$RUNNER_TEMP/mihomo-1.19.32.gz"
          printf '8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  %s\n' "$RUNNER_TEMP/mihomo-1.19.32.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/mihomo-1.19.32.gz" > "$RUNNER_TEMP/mihomo-1.19.32"
          chmod 755 "$RUNNER_TEMP/mihomo-1.19.32"
          python3 tests/node-automation-reality-runtime.py "$RUNNER_TEMP/reality-server" "$RUNNER_TEMP/mihomo-1.19.32" --client-baseline
