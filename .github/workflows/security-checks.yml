name: Isolated security and VLESS checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-password
          MARIADB_DATABASE: security_p0
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SECURITY_P0_DB_USER: root
      SECURITY_P0_DB_PASSWORD: fixture-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify test runtime
        run: |
          php -r 'foreach (["pdo_mysql", "pdo_sqlite", "pcntl", "sodium", "mbstring"] as $extension) { if (!extension_loaded($extension)) { throw new RuntimeException("Missing " . $extension); } }'
          composer --version
          node --version
      - name: Install isolated dependencies without booting the application
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Install frontend test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run security, protocol and queue regression gates
        env:
          SECURITY_P0_DB_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports['3306'] }};dbname=security_p0
        run: |
          node --test tests/security-p0.test.js tests/admin-asset-cache.test.js tests/admin-user-identity-edit.test.js tests/horizon-provisioning.test.js tests/horizon-fixed-workers.test.js tests/node-automation.test.js tests/telegram-group-access.test.js
          node --test tests/bandwagon-vps.test.js
          node --test tests/admin-ticket-id-search.test.js tests/admin-ticket-user-search.test.js tests/admin-ticket-sorting.test.js
          php tests/telegram-group-access.php
          php tests/wallet-recharge.php
          node --test tests/wallet-recharge.test.js tests/elephant-route-dashboard-v2.test.js tests/elephant-route-pages-v2.test.js tests/elephant-route-purchase-notice.test.js
          node --test tests/elephant-route-notice.test.js
          php scripts/version-admin-assets.php --check
      - name: Verify VLESS changes when present
        if: hashFiles('tests/vless-config.php') != ''
        run: |
          node --test tests/vless-admin-form.test.js
          php tests/vless-config.php
          php tests/vless-elephant-subscription.php
          php tests/ios-reality-subscription.php
          php tests/v2rayng-reality-subscription.php
          php tests/passwall-reality-subscription.php
      - name: Verify real modern REALITY probes with fixed release binaries
        env:
          V2BX_TEST_LOG: debug
          REALITY_FIXTURE_DEBUG: '1'
        run: |
          sh scripts/install-node-automation-mihomo.sh "$RUNNER_TEMP/reality-mihomo"
          curl -fLsS --connect-timeout 10 --max-time 180 --retry 2 https://github.com/joyefrck/v2bx_Outbound/releases/download/core-v1.1.0/V2bX-linux-amd64.zip -o "$RUNNER_TEMP/reality-server.zip"
          printf '87ec070fed7d9bd9ff056f7f189766e1274d9095380bf4d03a31c45eb59be2c9  %s\n' "$RUNNER_TEMP/reality-server.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/reality-server.zip" V2bX > "$RUNNER_TEMP/reality-server"
          chmod 755 "$RUNNER_TEMP/reality-server"
          python3 tests/node-automation-reality-runtime.py "$RUNNER_TEMP/reality-server" "$RUNNER_TEMP/reality-mihomo"
          python3 tests/node-automation-reality-runtime.py "$RUNNER_TEMP/reality-server" "$RUNNER_TEMP/reality-mihomo" --subscription-baseline
      - name: Verify third-party Mihomo baseline with modern REALITY
        run: |
          curl -fLsS --connect-timeout 10 --max-time 180 --retry 2 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o "$RUNNER_TEMP/mihomo-1.19.32.gz"
          printf '8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  %s\n' "$RUNNER_TEMP/mihomo-1.19.32.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/mihomo-1.19.32.gz" > "$RUNNER_TEMP/mihomo-1.19.32"
          chmod 755 "$RUNNER_TEMP/mihomo-1.19.32"
          python3 tests/node-automation-reality-runtime.py "$RUNNER_TEMP/reality-server" "$RUNNER_TEMP/mihomo-1.19.32" --client-baseline
